version: "3.8"

# ===========================================
# Homeschool LMS - Local Development Services
# ===========================================
# Provides Redis for caching. For the full Supabase stack,
# use the Supabase CLI (`supabase start`) or connect to
# your Supabase cloud project via .env variables.

services:
  # -----------------------------------------
  # Redis - Caching & Session Store
  # -----------------------------------------
  redis:
    image: redis:7-alpine
    container_name: homeschool-lms-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -----------------------------------------
  # RedisInsight - Redis GUI (optional)
  # -----------------------------------------
  redis-insight:
    image: redis/redisinsight:latest
    container_name: homeschool-lms-redis-insight
    restart: unless-stopped
    ports:
      - "5540:5540"
    depends_on:
      redis:
        condition: service_healthy
    profiles:
      - tools

volumes:
  redis_data:
    driver: local
